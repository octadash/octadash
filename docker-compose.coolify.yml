# Octadash on Coolify.
# New resource > Git repository (Docker Compose build pack) > Docker Compose Location:
#   /docker-compose.coolify.yml
# Coolify generates every password (Postgres, ClickHouse, Valkey, Garage), the
# secret and one domain per public service (panel and ingest). You can replace
# the domains in the Domains tab. ClickHouse, Valkey and Garage are managed by
# Octadash: nothing to set up.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: octadash
    command: ["postgres", "-c", "default_toast_compression=lz4"]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -d octadash -U "$$POSTGRES_USER"']
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.49.6-alpine
    environment:
      CLICKHOUSE_DB: octadash
      CLICKHOUSE_USER: octadash
      CLICKHOUSE_PASSWORD: ${SERVICE_PASSWORD_CLICKHOUSE}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Same file as docker/clickhouse/octadash.xml (a test keeps them equal).
      - type: bind
        source: ./clickhouse/octadash.xml
        target: /etc/clickhouse-server/config.d/octadash.xml
        read_only: true
        content: |
          <!-- Octadash defaults for the bundled ClickHouse: fits a 4 GB VPS next to
               Postgres, Valkey and the Octadash roles, and keeps ClickHouse's own
               logging tables from filling the disk. Mounted into config.d. -->
          <clickhouse>
              <logger>
                  <level>warning</level>
                  <console>1</console>
              </logger>
              <!-- At most 40% of the machine's memory for ClickHouse. -->
              <max_server_memory_usage_to_ram_ratio>0.4</max_server_memory_usage_to_ram_ratio>
              <mark_cache_size>268435456</mark_cache_size>
              <index_mark_cache_size>67108864</index_mark_cache_size>
              <uncompressed_cache_size>0</uncompressed_cache_size>
              <!-- BACKUP ... TO File('name.zip') writes to /var/lib/clickhouse/backups. -->
              <backups>
                  <allowed_path>backups/</allowed_path>
              </backups>
              <!-- Internal introspection tables. Octadash does not read them. -->
              <query_log remove="1"/>
              <query_thread_log remove="1"/>
              <query_views_log remove="1"/>
              <query_metric_log remove="1"/>
              <part_log remove="1"/>
              <trace_log remove="1"/>
              <text_log remove="1"/>
              <metric_log remove="1"/>
              <asynchronous_metric_log remove="1"/>
              <processors_profile_log remove="1"/>
              <opentelemetry_span_log remove="1"/>
              <session_log remove="1"/>
              <error_log remove="1"/>
              <latency_log remove="1"/>
              <blob_storage_log remove="1"/>
              <backup_log remove="1"/>
              <s3queue_log remove="1"/>
              <asynchronous_insert_log remove="1"/>
              <background_schedule_pool_log remove="1"/>
          </clickhouse>
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  valkey:
    image: valkey/valkey:9.2.1-alpine
    environment:
      VALKEY_PASSWORD: ${SERVICE_PASSWORD_VALKEY}
    command:
      [
        "sh",
        "-c",
        'exec valkey-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$VALKEY_PASSWORD"',
      ]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  # File storage (S3-compatible). Same as in docker-compose.yml.
  garage:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${SERVICE_HEX_64_GARAGERPC}
      GARAGE_DEFAULT_ACCESS_KEY: GK${SERVICE_HEX_32_GARAGEKEY}
      GARAGE_DEFAULT_SECRET_KEY: ${SERVICE_HEX_64_GARAGESECRET}
      GARAGE_DEFAULT_BUCKET: octadash
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      # Same file as docker/garage/garage.toml (a test keeps them equal).
      - type: bind
        source: ./garage/garage.toml
        target: /etc/garage.toml
        read_only: true
        content: |
          # Octadash defaults for the bundled Garage (file storage). One node, no
          # replication: the copy lives on this server's volumes, backed up with the
          # others. Secrets come from the environment (GARAGE_RPC_SECRET,
          # GARAGE_DEFAULT_ACCESS_KEY, GARAGE_DEFAULT_SECRET_KEY), so this file has none.
          metadata_dir = "/var/lib/garage/meta"
          data_dir = "/var/lib/garage/data"
          # SQLite survives an unclean shutdown better than LMDB, and a single node has
          # no other copy to rebuild from.
          db_engine = "sqlite"
          # Clean copies of the metadata, to recover from a damaged database.
          metadata_auto_snapshot_interval = "6h"
          replication_factor = 1

          rpc_bind_addr = "[::]:3901"
          rpc_public_addr = "127.0.0.1:3901"

          [s3_api]
          s3_region = "garage"
          api_bind_addr = "[::]:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    image: ghcr.io/octadash/octadash:${OCTADASH_VERSION:-edge}
    command: ["web"]
    environment:
      OCTADASH_URL: ${SERVICE_URL_WEB_3000}
      OCTADASH_INGEST_URL: ${SERVICE_URL_INGEST_4000}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/octadash
      CLICKHOUSE_URL: http://octadash:${SERVICE_PASSWORD_CLICKHOUSE}@clickhouse:8123/octadash
      VALKEY_URL: redis://:${SERVICE_PASSWORD_VALKEY}@valkey:6379
      OCTADASH_SECRET: ${SERVICE_PASSWORD_64_OCTADASH}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      valkey:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ingest:
    image: ghcr.io/octadash/octadash:${OCTADASH_VERSION:-edge}
    command: ["ingest"]
    environment:
      SERVICE_URL_INGEST_4000: /
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/octadash
      CLICKHOUSE_URL: http://octadash:${SERVICE_PASSWORD_CLICKHOUSE}@clickhouse:8123/octadash
      VALKEY_URL: redis://:${SERVICE_PASSWORD_VALKEY}@valkey:6379
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://garage:3900}
      STORAGE_BUCKET: octadash
      STORAGE_REGION: ${STORAGE_REGION:-garage}
      STORAGE_ACCESS_KEY_ID: GK${SERVICE_HEX_32_GARAGEKEY}
      STORAGE_SECRET_ACCESS_KEY: ${SERVICE_HEX_64_GARAGESECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      valkey:
        condition: service_started
      garage:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: ghcr.io/octadash/octadash:${OCTADASH_VERSION:-edge}
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/octadash
      CLICKHOUSE_URL: http://octadash:${SERVICE_PASSWORD_CLICKHOUSE}@clickhouse:8123/octadash
      VALKEY_URL: redis://:${SERVICE_PASSWORD_VALKEY}@valkey:6379
      OCTADASH_SECRET: ${SERVICE_PASSWORD_64_OCTADASH}
      OCTADASH_URL: ${SERVICE_URL_WEB_3000}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://garage:3900}
      STORAGE_BUCKET: octadash
      STORAGE_REGION: ${STORAGE_REGION:-garage}
      STORAGE_ACCESS_KEY_ID: GK${SERVICE_HEX_32_GARAGEKEY}
      STORAGE_SECRET_ACCESS_KEY: ${SERVICE_HEX_64_GARAGESECRET}
      OCTADASH_STORAGE_LIMIT_GB: ${OCTADASH_STORAGE_LIMIT_GB:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      valkey:
        condition: service_started
      garage:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
  clickhouse-data:
  valkey-data:
  garage-meta:
  garage-data:
