# Local development: Postgres, ClickHouse and Valkey. Run the apps with `pnpm dev`.
name: octadash-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: octadash
      POSTGRES_PASSWORD: octadash
      POSTGRES_DB: octadash
    command: ["postgres", "-c", "default_toast_compression=lz4"]
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octadash -d octadash"]
      interval: 2s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.49.6-alpine
    environment:
      CLICKHOUSE_DB: octadash
      CLICKHOUSE_USER: octadash
      CLICKHOUSE_PASSWORD: octadash
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    ports:
      - "8123:8123"
    volumes:
      - clickhouse-dev:/var/lib/clickhouse
      - ./docker/clickhouse/octadash.xml:/etc/clickhouse-server/config.d/octadash.xml:ro

  valkey:
    image: valkey/valkey:9.2.1-alpine
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "octadash"]
    ports:
      - "6379:6379"
    volumes:
      - valkey-dev:/data

volumes:
  postgres-dev:
  clickhouse-dev:
  valkey-dev:
