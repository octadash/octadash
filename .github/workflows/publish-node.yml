name: Publish @octadash/node

# A tag such as node-v0.1.0 publishes packages/node to npm, with provenance.
# Needs the NPM_TOKEN secret (an npm automation token of the @octadash org).
on:
  push:
    tags: ["node-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the package version
        run: test "node-v$(node -p "require('./packages/node/package.json').version")" = "${GITHUB_REF_NAME}"
      - run: pnpm --filter @octadash/node test
      - run: pnpm --filter @octadash/node build
      - run: pnpm publish --access public --no-git-checks --provenance
        working-directory: packages/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
