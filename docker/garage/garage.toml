# Octadash defaults for the bundled Garage (file storage). One node, no
# replication: the copy lives on this server's volumes, backed up with the
# others. Secrets come from the environment (GARAGE_RPC_SECRET,
# GARAGE_DEFAULT_ACCESS_KEY, GARAGE_DEFAULT_SECRET_KEY), so this file has none.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
# SQLite survives an unclean shutdown better than LMDB, and a single node has
# no other copy to rebuild from.
db_engine = "sqlite"
# Clean copies of the metadata, to recover from a damaged database.
metadata_auto_snapshot_interval = "6h"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
