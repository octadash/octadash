# English pages are built under /en and served without the prefix
# (docs.octadash.com/install); Portuguese ones keep /pt.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  gzip on;
  gzip_types text/css text/plain application/javascript application/json application/octet-stream image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = / {
    try_files /en.html =404;
    add_header Cache-Control "public, max-age=300";
  }

  # One address per page: /en/... goes to the address without the prefix.
  location = /en { return 301 /; }
  location ^~ /en/ { rewrite ^/en/(.*)$ /$1 permanent; }

  location / {
    try_files $uri $uri.html /en$uri /en$uri.html =404;
    add_header Cache-Control "public, max-age=300";
  }

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  error_page 404 /404.html;
}
