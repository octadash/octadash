# Octadash: self-hosted install with Docker Compose.
#   ./scripts/generate-env.sh   # creates .env with every password and the secret
#   docker compose up -d
# Panel on :3000, ingest on :4000. Put a reverse proxy with HTTPS in front of both.
# Using Coolify? Deploy docker-compose.coolify.yml instead.
name: octadash

x-octadash: &octadash
  image: ghcr.io/octadash/octadash:${OCTADASH_VERSION:-edge}
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://octadash:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/octadash
    CLICKHOUSE_URL: http://octadash:${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}@clickhouse:8123/octadash
    VALKEY_URL: redis://:${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}@valkey:6379
    OCTADASH_URL: ${OCTADASH_URL:-http://localhost:3000}
    OCTADASH_INGEST_URL: ${OCTADASH_INGEST_URL:-http://localhost:4000}
    OCTADASH_SECRET: ${OCTADASH_SECRET:?set OCTADASH_SECRET in .env}
    # File storage. The bundled Garage by default; point these at S3, R2 or any
    # S3-compatible bucket to keep files there instead.
    STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://garage:3900}
    STORAGE_BUCKET: ${STORAGE_BUCKET:-octadash}
    STORAGE_REGION: ${STORAGE_REGION:-garage}
    STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?set STORAGE_ACCESS_KEY_ID in .env}
    STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?set STORAGE_SECRET_ACCESS_KEY in .env}
    OCTADASH_STORAGE_LIMIT_GB: ${OCTADASH_STORAGE_LIMIT_GB:-20}
    LOG_LEVEL: ${LOG_LEVEL:-info}
  # ClickHouse, Valkey and Garage only need to be started: each role waits for them
  # itself and logs a clear error (for example, a CPU without AVX2).
  depends_on:
    postgres:
      condition: service_healthy
    clickhouse:
      condition: service_started
    valkey:
      condition: service_started
    garage:
      condition: service_started

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: octadash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: octadash
    # lz4 compresses large JSON payloads (events, errors) faster than the default.
    command: ["postgres", "-c", "default_toast_compression=lz4"]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octadash -d octadash"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Raw events, errors, logs and their rollups. Created, migrated and trimmed by
  # Octadash. The official amd64 image needs an x86-64-v3 CPU (AVX2); arm64 works.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.49.6-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: octadash
      CLICKHOUSE_USER: octadash
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/octadash.xml:/etc/clickhouse-server/config.d/octadash.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Buffer between the ingest and the worker (one stream per kind of data).
  # Append-only persistence, and no eviction: queued data is never dropped.
  valkey:
    image: valkey/valkey:9.2.1-alpine
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    command:
      [
        "sh",
        "-c",
        'exec valkey-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$VALKEY_PASSWORD"',
      ]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  # File storage (S3-compatible): attachments, replays, profiles and anything
  # over 1 MB. One node; the key and the bucket are made on first start from
  # .env, so there is nothing to set up. Not exposed outside the compose.
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_DEFAULT_ACCESS_KEY: ${STORAGE_ACCESS_KEY_ID:?set STORAGE_ACCESS_KEY_ID in .env}
      GARAGE_DEFAULT_SECRET_KEY: ${STORAGE_SECRET_ACCESS_KEY:?set STORAGE_SECRET_ACCESS_KEY in .env}
      GARAGE_DEFAULT_BUCKET: ${STORAGE_BUCKET:-octadash}
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    <<: *octadash
    command: ["web"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ingest:
    <<: *octadash
    command: ["ingest"]
    ports:
      - "${INGEST_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *octadash
    command: ["worker"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
  clickhouse-data:
  valkey-data:
  garage-meta:
  garage-data:
